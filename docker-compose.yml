volumes:
  db-data:

networks:
  edge:
  data:
    internal: true
  proxy:
    external: true
    name: caddy_proxy

x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  DB_HOST: ${DB_HOST:-db}

services:
  db:
    image: postgres:15
    networks: [data]
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *log

  api:
    build: api
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, data]
    environment:
      <<: *db-env
      PORT: 8000
      PUBLIC_URL: ${PUBLIC_URL}

      TRUST_PROXY: 1
    restart: unless-stopped
    logging: *log

  web:
    build:
      context: web
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge:
      proxy:
        aliases:
          - mobility-web
    restart: unless-stopped
    logging: *log
