volumes:
  db-data:
  caddy_data:
  caddy_config:

networks:
  edge:
  data:
    internal: true

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  DB_HOST: ${DB_HOST:-db}

services:
  db:
    image: postgres:15
    networks: [data]
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: api
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, data]
    environment:
      <<: *db-env
      PORT: 8000
      PUBLIC_URL: ${PUBLIC_URL}

      TRUST_PROXY: 1
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy

  web:
    build: web
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped
